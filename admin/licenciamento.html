<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assistente Operacional — Licenciamento</title><style>body{font-family:Arial,sans-serif;background:#f4f6f8;color:#17202a;margin:0;padding:20px}.wrap{max-width:1100px;margin:auto}.card{background:#fff;padding:20px;border-radius:14px;margin-bottom:16px;box-shadow:0 2px 12px #0001}h1{margin-top:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}label{font-size:12px;font-weight:700;display:block;margin-bottom:5px}input,select{width:100%;padding:10px;border:1px solid #d7dee7;border-radius:8px;box-sizing:border-box}button{border:0;border-radius:8px;padding:10px 14px;font-weight:700;background:#17202a;color:white;cursor:pointer}.green{background:#16803c}.red{background:#b42318}.muted{color:#64748b;font-size:13px}.kpi{padding:15px;border:1px solid #e2e8f0;border-radius:10px}.kpi b{display:block;font-size:25px}.client{border:1px solid #e2e8f0;border-radius:10px;padding:14px;margin-top:10px}.badge{display:inline-block;padding:5px 8px;border-radius:20px;background:#eef2ff;font-size:12px}</style></head><body><div class="wrap"><div class="card"><h1>🔐 Licenciamento</h1><p class="muted">Painel do proprietário — controle manual de testes, assinaturas e acesso.</p><div class="grid"><div class="kpi">Ativos<b id="ativos">0</b></div><div class="kpi">Em teste<b id="testes">0</b></div><div class="kpi">Vencidos<b id="vencidos">0</b></div><div class="kpi">Bloqueados<b id="bloqueados">0</b></div></div></div><div class="card"><h2>Novo cliente</h2><div class="grid"><div><label>Empresa</label><input id="nome" placeholder="Empresa ABC"></div><div><label>Responsável</label><input id="responsavel" placeholder="Nome"></div><div><label>E-mail</label><input id="email" type="email" placeholder="cliente@email.com"></div><div><label>Plano</label><select id="plano"><option>Profissional</option><option>Básico</option><option>Empresarial</option></select></div><div><label>Tipo de acesso</label><select id="tipo"><option value="trial">Teste</option><option value="paid">Assinatura paga</option><option value="manual">Manual</option></select></div><div><label>Dias de acesso</label><input id="dias" type="number" min="1" value="30"></div></div><button class="green" onclick="add()" style="margin-top:14px">+ Criar e ativar</button></div><div class="card"><h2>Clientes</h2><div id="lista"></div></div></div><script>const KEY='assistente_operacional_licencas_v1';let db=JSON.parse(localStorage.getItem(KEY)||'[]');function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}function add(){const nome=document.getElementById('nome').value.trim();if(!nome)return alert('Informe a empresa.');const dias=Math.max(1,Number(document.getElementById('dias').value)||30);const now=new Date(),exp=new Date(now);exp.setDate(exp.getDate()+dias);db.push({id:crypto.randomUUID(),empresa:nome,responsavel:document.getElementById('responsavel').value.trim(),email:document.getElementById('email').value.trim(),plano:document.getElementById('plano').value,tipo:document.getElementById('tipo').value,status:document.getElementById('tipo').value==='trial'?'trial':'active',inicio:now.toISOString(),expira:exp.toISOString(),pagamentoConfirmado:false});['nome','responsavel','email'].forEach(id=>document.getElementById(id).value='');save()}function status(c){if(c.status==='blocked')return 'blocked';if(new Date(c.expira)<new Date()&&!c.pagamentoConfirmado)return 'expired';return c.status}function action(id,s){const c=db.find(x=>x.id===id);if(!c)return;if(s==='active'){c.status='active';c.pagamentoConfirmado=true}if(s==='blocked'){c.status='blocked'}if(s==='trial'){c.status='trial';c.pagamentoConfirmado=false}if(s==='extend'){const d=new Date(c.expira<new Date()?new Date():c.expira);d.setDate(d.getDate()+30);c.expira=d.toISOString();if(c.status==='expired')c.status='trial'}save()}function render(){let counts={active:0,trial:0,expired:0,blocked:0};db.forEach(c=>counts[status(c)]++);ativos.textContent=counts.active;testes.textContent=counts.trial;vencidos.textContent=counts.expired;bloqueados.textContent=counts.blocked;lista.innerHTML=db.length?db.map(c=>{let s=status(c),label={active:'🟢 Ativo',trial:'🟡 Em teste',expired:'⏰ Vencido',blocked:'🔴 Bloqueado'}[s];return `<div class="client"><b>${esc(c.empresa)}</b> <span class="badge">${label}</span><div class="muted">${esc(c.plano)} · ${c.tipo} · vence ${new Date(c.expira).toLocaleDateString('pt-BR')}</div><div style="margin-top:10px;display:flex;gap:7px;flex-wrap:wrap"><button class="green" onclick="action('${c.id}','active')">Ativar</button><button onclick="action('${c.id}','trial')">Teste</button><button onclick="action('${c.id}','extend')">+30 dias</button><button class="red" onclick="action('${c.id}','blocked')">Bloquear</button></div></div>`}).join(''):'<p class="muted">Nenhum cliente cadastrado.</p>'}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}render();</script></body></html>
