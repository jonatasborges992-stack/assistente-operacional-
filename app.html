<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071a39"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="OPERA ONE"><link rel="manifest" href="./manifest.webmanifest?v=11.0.0"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>OPERA ONE</title><style>html,body{margin:0;width:100%;height:100%;background:#f4f7fb;font-family:Inter,Segoe UI,Arial,sans-serif}#operaApp{width:100%;min-height:100%;background:#f4f7fb}.install{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:20;border:0;border-radius:999px;padding:11px 15px;background:#168cff;color:#fff;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.25);display:none}.install.show{display:block}</style></head><body><div id="operaApp"></div><button id="install" class="install">＋ Instalar OPERA ONE</button><script>const APP_VERSION='11.0.0';const target='./opera-one-v11.html?v='+APP_VERSION;fetch(target,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Falha ao carregar OPERA ONE');return r.text()}).then(html=>{document.getElementById('operaApp').innerHTML=html;document.querySelectorAll('#operaApp script').forEach(old=>{const s=document.createElement('script');s.textContent=old.textContent;Array.from(old.attributes).forEach(a=>s.setAttribute(a.name,a.value));old.replaceWith(s)})}).catch(()=>{document.getElementById('operaApp').innerHTML='<div style="padding:30px;font-family:Arial"><h2>OPERA ONE</h2><p>Não foi possível carregar a interface. Atualize a página.</p></div>'});if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js?v='+APP_VERSION).catch(()=>{});let deferredPrompt;const btn=document.getElementById('install');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;btn.classList.add('show')});btn.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;btn.classList.remove('show')});window.addEventListener('appinstalled',()=>btn.classList.remove('show'));</script></body></html>
