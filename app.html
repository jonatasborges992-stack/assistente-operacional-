<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071a39">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OPERA ONE">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>OPERA ONE</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#02050c;font-family:Inter,Segoe UI,Arial,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;background:#02050c}iframe{width:100%;height:100%;border:0;display:block;background:#02050c}
.install{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:20;border:1px solid rgba(25,230,255,.4);border-radius:999px;padding:11px 15px;background:linear-gradient(135deg,#071a39,#168cff);color:#fff;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.35);display:none}.install.show{display:block}
</style>
</head>
<body>
<div id="app"><iframe id="operaFrame" src="./index.html" title="OPERA ONE — Gestão Inteligente de Operações"></iframe></div>
<button id="install" class="install">＋ Instalar OPERA ONE</button>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js?v=4').catch(()=>{})}
let deferredPrompt;const btn=document.getElementById('install');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;btn.classList.add('show')});btn.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;btn.classList.remove('show')});window.addEventListener('appinstalled',()=>btn.classList.remove('show'));
const frame=document.getElementById('operaFrame');
function installScripts(){try{const doc=frame.contentDocument;if(!doc||doc.getElementById('opera-voice-loader'))return;const a=doc.createElement('script');a.id='opera-intelligence-loader';a.src='./opera-intelligence.js?v=2';a.defer=true;doc.body.appendChild(a);const s=doc.createElement('script');s.id='opera-voice-loader';s.src='./voice-controller-v4.js?v=4';s.defer=true;doc.body.appendChild(s)}catch(e){console.warn('OPERA ONE:',e)}}
frame.addEventListener('load',installScripts);setTimeout(installScripts,1800);
</script>
</body>
</html>
