<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071a39"><meta http-equiv="Cache-Control" content="no-store"><link rel="manifest" href="./manifest.webmanifest?v=11.0.29"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>OPERA ONE</title></head><body style="margin:0;background:#f4f7fb"><div id="boot" style="font-family:Arial,sans-serif;padding:24px;color:#0f172a">Abrindo OPERA ONE…</div><script>
(async function(){
  const fail=msg=>{document.body.innerHTML='<div style="font-family:Arial,sans-serif;padding:24px;color:#0f172a"><b>OPERA ONE</b><br><br>'+msg+'<br><br><button onclick="location.reload()">Tentar novamente</button></div>'};
  try{
    const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),8000);
    const response=await fetch('./opera-one-v11.html?v=11.0.29',{cache:'no-store',signal:controller.signal});
    clearTimeout(timer);
    if(!response.ok)throw new Error('Núcleo não disponível ('+response.status+').');
    let html=await response.text();
    html=html.replace('<section class="view" id="inicio">','<section class="view active" id="inicio">');
    const doc=new DOMParser().parseFromString(html,'text/html');
    if(!doc.body||!doc.body.innerHTML)throw new Error('Núcleo vazio.');
    document.head.innerHTML=doc.head.innerHTML;
    document.body.innerHTML=doc.body.innerHTML;
    const scripts=Array.from(doc.scripts).map(s=>({src:s.src,text:s.textContent||''}));
    for(const item of scripts){const s=document.createElement('script');if(item.src)s.src=item.src;else s.textContent=item.text;document.body.appendChild(s)}
    await new Promise(r=>setTimeout(r,0));
    try{if(typeof window.go==='function')window.go('inicio');else{const el=document.getElementById('inicio');if(el)el.classList.add('active')}}catch(e){}
    for(const src of ['./opera-runtime-fix.js?v=11.0.29','./ai-interpreter.js?v=11.0.29','./opera-ai-bridge.js?v=11.0.29'])await new Promise(resolve=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>resolve();document.body.appendChild(s)});
    const bindMobileBar=()=>{const bar=document.querySelector('.mobilebar');if(!bar)return false;const buttons=Array.from(bar.querySelectorAll('button'));const views=['inicio','servicos','financeiro','cadastros'];buttons.forEach((button,index)=>{button.onclick=index===4?()=>{if(typeof window.startVoice==='function')window.startVoice();}:()=>{if(typeof window.go==='function')window.go(views[index]);else{const el=document.getElementById(views[index]);if(el){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));el.classList.add('active')}}}});return true};
    bindMobileBar();
    setTimeout(bindMobileBar,250);
    setTimeout(bindMobileBar,1000);
  }catch(error){console.error('OPERA ONE boot error:',error);fail('Não foi possível abrir o sistema agora.');}
})();
</script></body></html>
