<body>
<p style="font-family:Arial,sans-serif;padding:24px">Abrindo OPERA ONE…</p>
<script>
(function(){
  try{
    if('serviceWorker' in navigator){
      navigator.serviceWorker.getRegistrations().then(function(regs){
        return Promise.all(regs.map(function(r){return r.unregister();}));
      }).catch(function(){});
    }
  }catch(e){}
  setTimeout(function(){location.replace('./opera-one-v11.html?v=11.0.13');},120);
})();
</script>
