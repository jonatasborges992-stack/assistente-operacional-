<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071a39">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>OPERA ONE</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7fb}#operaApp{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="operaApp" title="OPERA ONE" src="./opera-one-v11.html" allow="microphone"></iframe>
<script>
(function(){
  const frame=document.getElementById('operaApp');
  function load(src){return new Promise((resolve,reject)=>{const d=frame.contentDocument;if(!d||!d.body)return reject(new Error('Documento do OPERA ONE indisponível.'));const s=d.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;d.body.appendChild(s)})}
  frame.addEventListener('load',async()=>{
    try{
      await load('./ai-interpreter.js');
      await load('./opera-ai-bridge.js');
    }catch(error){console.error('OPERA ONE bridge:',error)}
  });
})();
</script>
</body>
</html>
