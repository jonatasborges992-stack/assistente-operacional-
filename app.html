<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071a39">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OPERA ONE">
<link rel="manifest" href="./manifest.webmanifest?v=11.0.16">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>OPERA ONE</title>
</head>
<body style="margin:0;background:#f4f7fb">
<div id="boot" style="font-family:Arial,sans-serif;padding:24px;color:#0f172a">Abrindo OPERA ONE…</div>
<script>
(async function(){
  const boot=document.getElementById('boot');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
  }catch(e){}
  try{
    const response=await fetch('./opera-one-v11.html?v=11.0.16',{cache:'no-store'});
    if(!response.ok)throw new Error('Falha ao carregar o núcleo.');
    const html=await response.text();
    const doc=new DOMParser().parseFromString(html,'text/html');
    const scriptCode=Array.from(doc.scripts).map(s=>({src:s.src,text:s.textContent||''}));
    document.documentElement.replaceWith(doc.documentElement);
    Array.from(document.scripts).forEach(s=>s.remove());
    for(const item of scriptCode){
      const s=document.createElement('script');
      if(item.src)s.src=item.src;
      else s.textContent=item.text;
      document.body.appendChild(s);
    }
    const inicio=document.getElementById('inicio');
    if(inicio)inicio.classList.add('active');
  }catch(error){
    if(boot)boot.innerHTML='<div style="font-weight:700;font-size:18px">OPERA ONE</div><div style="margin-top:8px">Não foi possível abrir o sistema agora.</div><button style="margin-top:16px;padding:12px 16px;border:0;border-radius:10px;background:#168cff;color:#fff;font-weight:700" onclick="location.reload()">Tentar novamente</button>';
  }
})();
</script>
</body>
</html>
