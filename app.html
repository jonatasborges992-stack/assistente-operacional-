<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071a39">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OPERA ONE">
<link rel="manifest" href="./manifest.webmanifest?v=11.0.7">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>OPERA ONE</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7fb}#operaApp{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="operaApp" title="OPERA ONE" src="./opera-one-v11.html?v=11.0.7" allow="microphone"></iframe>
<script>
(function(){
  const frame=document.getElementById('operaApp');
  const files=['./opera-dom-compat.js?v=11.0.7','./ai-interpreter.js?v=11.0.7','./opera-ai-bridge.js?v=11.0.7'];
  function load(src){return new Promise((resolve,reject)=>{
    const d=frame.contentDocument;
    if(!d||!d.body)return reject(new Error('Documento do OPERA ONE indisponível.'));
    const s=d.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error('Falha ao carregar '+src));d.body.appendChild(s);
  })}
  frame.addEventListener('load',async()=>{
    try{for(const file of files)await load(file)}
    catch(error){console.error('OPERA ONE runtime:',error)}
  });
})();
</script>
</body>
</html>
