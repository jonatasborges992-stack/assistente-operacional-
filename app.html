<meta name="apple-mobile-web-app-title" content="OPERA ONE">
<link rel="manifest" href="./manifest.webmanifest?v=11.0.14">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>OPERA ONE</title>
</head>
<body>
<p style="font-family:Arial,sans-serif;padding:24px">Abrindo OPERA ONE…</p>
<script>
(async function(){
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(function(r){return r.unregister();}));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(function(k){return caches.delete(k);}));
    }
  }catch(e){}
  location.replace('./opera-one-v11.html?v=11.0.14');
})();
</script>
</body>
</html>
