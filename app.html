<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071a39">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OPERA ONE">
<link rel="manifest" href="./manifest.webmanifest?v=11.0.4">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>OPERA ONE</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7fb;font-family:Inter,Segoe UI,Arial,sans-serif}
#operaFrame{display:block;width:100%;height:100%;height:100dvh;border:0;background:#f4f7fb}
.install{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:20;border:0;border-radius:999px;padding:11px 15px;background:#168cff;color:#fff;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.25);display:none}
.install.show{display:block}
</style>
</head>
<body>
<iframe id="operaFrame" title="OPERA ONE"></iframe>
<button id="install" class="install">＋ Instalar OPERA ONE</button>
<script>
const APP_VERSION='11.0.4';
const frame=document.getElementById('operaFrame');
const target='./opera-one-v11.html?v='+APP_VERSION;

function installProtectedVoice(w,d){
  w.operaVoiceRecognition=null;
  w.startVoice=function(){
    const input=d.getElementById('command'),status=d.getElementById('voiceStatus'),dot=d.getElementById('voiceDot'),SR=w.SpeechRecognition||w.webkitSpeechRecognition;
    if(!input||!status||!dot)return;
    if(!SR){status.textContent='Seu navegador não disponibilizou reconhecimento de voz. Tente Safari ou Chrome atualizado.';return}
    if(w.operaVoiceRecognition){try{w.operaVoiceRecognition.stop()}catch(e){}w.operaVoiceRecognition=null;dot.classList.remove('live');status.textContent='Voz encerrada. O texto continua editável.';return}
    const r=new SR();w.operaVoiceRecognition=r;r.lang='pt-BR';r.continuous=false;r.interimResults=true;r.maxAlternatives=1;
    dot.classList.add('live');status.textContent='Ouvindo… fale o lançamento do frete.';
    r.onresult=e=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript;input.value=t.trim();status.textContent='Texto reconhecido. Revise e toque em Resolver.'};
    r.onerror=e=>{dot.classList.remove('live');w.operaVoiceRecognition=null;status.textContent=e.error==='not-allowed'?'Permissão de microfone negada. Libere o microfone para o OPERA ONE.':'Não foi possível reconhecer a voz. Tente novamente.'};
    r.onend=()=>{dot.classList.remove('live');if(w.operaVoiceRecognition===r)w.operaVoiceRecognition=null};
    try{r.start()}catch(e){dot.classList.remove('live');w.operaVoiceRecognition=null}
  };
}

function recoverInitialView(w){
  try{
    const d=w.document,home=d.getElementById('inicio');
    if(!home)return;
    if(typeof w.go==='function'){
      try{w.go('inicio')}catch(e){home.classList.add('active')}
    }else{
      home.classList.add('active');
      d.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.getAttribute('data-view')==='inicio'));
    }
    if(typeof w.refresh==='function'){
      try{w.refresh()}catch(e){}
    }
  }catch(e){console.error('OPERA ONE recovery:',e)}
}

function boot(frameWindow){
  try{
    installProtectedVoice(frameWindow,frameWindow.document);
    frameWindow.OPERA_AI_ENDPOINT='/api/interpret';
    const s=frameWindow.document.createElement('script');
    s.src='./ai-interpreter.js?v='+APP_VERSION;
    s.async=false;
    frameWindow.document.body.appendChild(s);
    setTimeout(()=>recoverInitialView(frameWindow),50);
  }catch(e){console.error('OPERA ONE boot:',e)}
}

frame.addEventListener('load',()=>boot(frame.contentWindow));
frame.src=target;

if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js?v='+APP_VERSION).catch(()=>{});
let deferredPrompt;
const btn=document.getElementById('install');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;btn.classList.add('show')});
btn.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;btn.classList.remove('show')});
window.addEventListener('appinstalled',()=>btn.classList.remove('show'));
</script>
</body>
</html>
