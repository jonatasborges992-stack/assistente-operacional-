<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071a39"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="OPERA ONE"><link rel="manifest" href="./manifest.webmanifest?v=11.0.2"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>OPERA ONE</title><style>html,body{margin:0;width:100%;height:100%;background:#f4f7fb;font-family:Inter,Segoe UI,Arial,sans-serif}#operaApp{width:100%;min-height:100%;background:#f4f7fb}.install{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:20;border:0;border-radius:999px;padding:11px 15px;background:#168cff;color:#fff;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.25);display:none}.install.show{display:block}</style></head><body><div id="operaApp"></div><button id="install" class="install">＋ Instalar OPERA ONE</button><script>
const APP_VERSION='11.0.2';const target='./opera-one-v11.html?v='+APP_VERSION;
window.operaVoiceRecognition=null;window.startVoice=function(){const input=document.getElementById('command'),status=document.getElementById('voiceStatus'),dot=document.getElementById('voiceDot'),SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!input||!status||!dot)return;if(!SR){status.textContent='Seu navegador não disponibilizou reconhecimento de voz. Tente Safari ou Chrome atualizado.';return}if(window.operaVoiceRecognition){try{window.operaVoiceRecognition.stop()}catch(e){}window.operaVoiceRecognition=null;dot.classList.remove('live');status.textContent='Voz encerrada. O texto continua editável.';return}const r=new SR;window.operaVoiceRecognition=r;r.lang='pt-BR';r.continuous=false;r.interimResults=true;r.maxAlternatives=1;dot.classList.add('live');status.textContent='Ouvindo… fale o lançamento do frete.';r.onresult=e=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript;input.value=t.trim();status.textContent='Texto reconhecido. Revise e toque em Resolver.'};r.onerror=e=>{dot.classList.remove('live');window.operaVoiceRecognition=null;status.textContent=e.error==='not-allowed'?'Permissão de microfone negada. Libere o microfone para o OPERA ONE.':'Não foi possível reconhecer a voz. Tente novamente.'};r.onend=()=>{dot.classList.remove('live');if(window.operaVoiceRecognition===r)window.operaVoiceRecognition=null};try{r.start()}catch(e){dot.classList.remove('live');window.operaVoiceRecognition=null}};
function installAnalysis(){const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])),num=v=>Number(v)||0,money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),norm=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();const db=()=>{try{return JSON.parse(localStorage.getItem('assistente_operacional_v5')||'{"vehicles":[],"clients":[],"services":[],"closures":[]}')}catch{return{vehicles:[],clients:[],services:[],closures:[]}}};const pn=x=>{let s=String(x).trim();if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');else if(s.includes(','))s=s.replace(',','.');else if(/^\d+\.\d{3}$/.test(s))s=s.replace('.','');return num(s)};const pm=t=>{const m=t.match(/r?\$?\s*([0-9]{1,3}(?:\.[0-9]{3})*(?:,[0-9]{1,2})|[0-9]+(?:[.,][0-9]{1,2})?)/i);return m?pn(m[1]):0};const pc=(t,ls)=>{const l=norm(t);for(const x of ls){const n=norm(x),a=l.match(new RegExp(n+'\\s*(?:de|do|da|com|:)?\\s*r?\\$?\\s*([0-9]+(?:[.,][0-9]{1,2})?)'));if(a)return pn(a[1]);const b=l.match(new RegExp('r?\\$?\\s*([0-9]+(?:[.,][0-9]{1,2})?)\\s+(?:de|do|da)?\\s*'+n));if(b)return pn(b[1])}return 0};const parse=t=>{const d=db(),l=norm(t),client=(d.clients||[]).find(c=>l.includes(norm(c.nome))),vehicle=(d.vehicles||[]).find(v=>l.includes(norm(v.nome))||(v.placa&&l.includes(norm(v.placa))));let value=0,mv=l.match(/(?:frete|valor|por)\s*(?:de|do|da|a|:)?\s*r?\$?\s*([0-9]+(?:[.,][0-9]{1,2})?)/);if(mv)value=pn(mv[1]);if(!value)value=pm(t);const rt=t.match(/(?:de|origem)\s+(.+?)\s+(?:para|ate|até|destino)\s+(.+?)(?:\s+(?:por|r\$|diesel|combustivel|combustível|manutencao|manutenção|pedagio|pedágio|$))/i);return{client,vehicle,value,origin:rt?.[1]?.trim()||'',destination:rt?.[2]?.trim()||'',diesel:pc(t,['diesel','combustivel','combustível']),manut:pc(t,['manutenção','manutencao']),ped:pc(t,['pedágio','pedagio']),ter:pc(t,['terceirização','terceirizacao']),alim:pc(t,['alimentação','alimentacao'])}};
const open=p=>{window.operaPendingLaunch=p;const modal=document.getElementById('modal'),title=document.getElementById('modalTitle'),body=document.getElementById('modalBody');if(!modal||!title||!body)return;const mc=!p.client,mv=!p.vehicle,cost=p.diesel+p.manut+p.ped+p.ter+p.alim,profit=p.value-cost;title.textContent='Analisar lançamento';body.innerHTML='<p class="sub">Confira tudo antes de lançar. <b>Nada será gravado até você tocar em Lançar.</b></p><div class="analysis-grid"><div class="analysis-item '+(mc?'pending':'ok')+'"><div class="label">CLIENTE</div><div class="value">'+(p.client?esc(p.client.nome):'⚠️ Não cadastrado')+'</div>'+(mc?'<div class="warningline"><span>Cliente não encontrado.</span><button class="secondary" onclick="operaQuickClient()">＋ Cadastrar</button></div>':'')+'</div><div class="analysis-item '+(mv?'pending':'ok')+'"><div class="label">VEÍCULO</div><div class="value">'+(p.vehicle?esc(p.vehicle.nome):'⚠️ Não cadastrado')+'</div>'+(mv?'<div class="warningline"><span>Veículo não encontrado.</span><button class="secondary" onclick="operaQuickVehicle()">＋ Cadastrar</button></div>':'')+'</div><div class="analysis-item"><div class="label">ORIGEM</div><div class="value">'+esc(p.origin||'Não informada')+'</div></div><div class="analysis-item"><div class="label">DESTINO</div><div class="value">'+esc(p.destination||'Não informado')+'</div></div><div class="analysis-item"><div class="label">FRETE</div><div class="value">'+money(p.value)+'</div></div><div class="analysis-item"><div class="label">COMBUSTÍVEL</div><div class="value">'+money(p.diesel)+'</div></div><div class="analysis-item"><div class="label">MANUTENÇÃO</div><div class="value">'+money(p.manut)+'</div></div><div class="analysis-item"><div class="label">PEDÁGIO</div><div class="value">'+money(p.ped)+'</div></div><div class="analysis-item"><div class="label">TERCEIRIZAÇÃO</div><div class="value">'+money(p.ter)+'</div></div><div class="analysis-item"><div class="label">ALIMENTAÇÃO</div><div class="value">'+money(p.alim)+'</div></div><div class="analysis-item"><div class="label">CUSTO TOTAL</div><div class="value">'+money(cost)+'</div></div><div class="analysis-item '+(profit>=0?'ok':'pending')+'"><div class="label">LUCRO ESTIMADO</div><div class="value">'+money(profit)+'</div></div></div>'+(mc||mv?'<div class="warningline">⚠️ Cadastre os itens pendentes antes de lançar.</div>':'<div class="successline">✓ Cliente e veículo reconhecidos. Tudo pronto para conferência.</div>')+'<div class="analysis-actions"><button class="green launch" '+(mc||mv||!p.value?'disabled style="opacity:.5;cursor:not-allowed"':'')+' onclick="operaLaunch()">🚀 LANÇAR</button><button class="secondary" style="width:100%;margin-top:8px" onclick="closeModal()">Voltar e revisar</button></div>';modal.classList.add('show')};
window.resolveCommand=()=>{const t=document.getElementById('command')?.value.trim();if(t)open(parse(t))};window.operaLaunch=()=>{const p=window.operaPendingLaunch;if(!p?.client||!p?.vehicle||!p?.value)return alert('Para lançar, cadastre/confirme o cliente e o veículo e informe o valor.');const d=db();d.services=Array.isArray(d.services)?d.services:[];d.services.push({id:Date.now(),date:new Date().toISOString().slice(0,10),clientId:Number(p.client.id),vehicleId:Number(p.vehicle.id),origem:p.origin,destino:p.destination,valor:Number(p.value),status:'Pendente',km:0,comb:Number(p.diesel||0),ped:Number(p.ped||0),ter:Number(p.ter||0),alimentacao:Number(p.alim||0),hotel:0,motoristaDiarias:0,horasExtras:0,manutencao:Number(p.manut||0),outros:0});localStorage.setItem('assistente_operacional_v5',JSON.stringify(d));window.operaPendingLaunch=null;closeModal();if(typeof refresh==='function')refresh();const r=document.getElementById('commandResponse');if(r)r.innerHTML='<div class="successline"><b>✓ Lançamento realizado.</b> O serviço foi gravado no banco de dados do OPERA ONE.</div>';alert('Lançamento realizado com sucesso.')};window.operaQuickClient=()=>{const n=prompt('Nome do novo cliente:');if(!n?.trim())return;const d=db(),c={id:Date.now(),nome:n.trim(),contato:'',cnpj:''};d.clients.push(c);localStorage.setItem('assistente_operacional_v5',JSON.stringify(d));window.operaPendingLaunch.client=c;open(window.operaPendingLaunch)};window.operaQuickVehicle=()=>{const n=prompt('Nome do novo veículo:');if(!n?.trim())return;const p=prompt('Placa (opcional):')||'',c=Number(prompt('Consumo km/L (ex.: 2.8):')||0);if(c<=0)return alert('Informe um consumo válido.');const d=db(),v={id:Date.now(),nome:n.trim(),placa:p.trim(),consumo:c};d.vehicles.push(v);localStorage.setItem('assistente_operacional_v5',JSON.stringify(d));window.operaPendingLaunch.vehicle=v;open(window.operaPendingLaunch)}};
fetch(target,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Falha ao carregar OPERA ONE');return r.text()}).then(html=>{document.getElementById('operaApp').innerHTML=html;document.querySelectorAll('#operaApp script').forEach(old=>{const s=document.createElement('script');s.textContent=old.textContent;Array.from(old.attributes).forEach(a=>s.setAttribute(a.name,a.value));old.replaceWith(s)});installAnalysis()}).catch(()=>{document.getElementById('operaApp').innerHTML='<div style="padding:30px;font-family:Arial"><h2>OPERA ONE</h2><p>Não foi possível carregar a interface. Atualize a página.</p></div>'});
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js?v='+APP_VERSION).catch(()=>{});let deferredPrompt;const btn=document.getElementById('install');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;btn.classList.add('show')});btn.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;btn.classList.remove('show')});window.addEventListener('appinstalled',()=>btn.classList.remove('show'));</script></body></html>
